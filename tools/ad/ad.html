<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honeydle ad</title>
<style>
@font-face { font-family: "Press Start 2P"; src: url("/public/fonts/press-start-2p.woff2") format("woff2"); }
@font-face { font-family: "Libre Franklin"; src: url("/public/fonts/libre-franklin-latin-600-normal.woff2") format("woff2"); font-weight: 500 600; }
@font-face { font-family: "Libre Franklin"; src: url("/public/fonts/libre-franklin-latin-800-normal.woff2") format("woff2"); font-weight: 700 900; }
:root { --yellow: #ffd60a; --gold: #cf9a06; --soft: #f3d27a; --muted: #a8a8a8; --chip: #241d00; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff; font-family: "Press Start 2P", "Noto Color Emoji", monospace; }
* { font-synthesis: none; font-weight: 400 !important; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#bgGlow { position: absolute; inset: -200px; }
#dots { position: absolute; inset: -100px; opacity: .45;
  background-image: radial-gradient(rgba(255,255,255,0.10) 2.5px, transparent 2.5px); background-size: 54px 54px; }
#hexes { position: absolute; inset: 0; }
#hexes svg { position: absolute; }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; opacity: 0; }
.pixel { font-family: "Press Start 2P", monospace; }
.logo { font-family: "Press Start 2P", monospace; color: var(--yellow); letter-spacing: 2px;
  text-shadow: 8px 8px 0 #7a5a00, 0 0 50px rgba(255,214,10,.6); }
em { font-style: normal; color: var(--yellow); }
.slam { display: inline-block; will-change: transform; }

/* hook */
#hook { justify-content: center; text-align: center; gap: 10px; }
#hook .w { font-size: 118px; line-height: 1.35; }
#hook .w.y { color: var(--yellow); text-shadow: 0 0 60px rgba(255,214,10,.5); }
#drips { position: absolute; top: 0; left: 0; right: 0; height: 0; }
.drip { position: absolute; top: -10px; background: linear-gradient(#ffd60a, #e8a800); border-radius: 0 0 40px 40px;
  box-shadow: 0 0 30px rgba(255,190,0,.5); }
#flyBee { position: absolute; width: 230px; height: 230px; image-rendering: pixelated; }

/* game */
#game { padding-top: 220px; }
.meta { display: flex; gap: 22px; align-items: center; }
.chip { background: var(--chip); color: var(--yellow); border: 3px solid #4d4116; padding: 14px 26px; border-radius: 999px;
  font-size: 24px; letter-spacing: .08em; text-transform: uppercase; }
.round { font-size: 24px; color: var(--muted); }
.q { margin-top: 40px; font-size: 42px; line-height: 1.5; text-align: center; padding: 0 40px; height: 250px; }
.q .wd { display: inline-block; margin: 0 .32em; }
.num { margin-top: 34px; font-size: 150px; color: var(--yellow); text-shadow: 0 0 50px rgba(255,214,10,.5); height: 190px; }
#combHost { position: relative; margin-top: 10px; width: 940px; height: 560px; display: grid; place-items: center; }
#combHost > canvas { grid-area: 1 / 1; image-rendering: pixelated; }
#combHost > .comb-glow { image-rendering: auto; mix-blend-mode: screen; }
#slider { position: absolute; left: 110px; right: 110px; top: 1500px; height: 70px; }
#slider .track { position: absolute; left: 0; right: 0; top: 26px; height: 18px; border-radius: 9px; background: #2e2e2e; }
#slider .fill { position: absolute; left: 0; top: 26px; height: 18px; border-radius: 9px; background: var(--yellow); box-shadow: 0 0 20px rgba(255,214,10,.6); }
#slider .knob { position: absolute; top: 0; width: 70px; height: 70px; margin-left: -35px; border-radius: 50%; background: #fff; box-shadow: 0 6px 0 #bbb; }
#touch { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
  background: rgba(255,255,255,.28); border: 5px solid rgba(255,255,255,.85); }
.btn { position: absolute; top: 1640px; left: 110px; right: 110px; height: 150px; border-radius: 28px; background: var(--yellow);
  color: #000; display: grid; place-items: center; font-size: 46px; box-shadow: 0 12px 0 var(--gold); }
#ripple { position: absolute; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; border: 8px solid #fff; opacity: 0; }
#stamp { position: absolute; top: 1440px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 30px; }
#stamp .rays { position: absolute; left: 50%; top: 50%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; opacity: 0;
  background: repeating-conic-gradient(rgba(255,214,10,.22) 0 9deg, transparent 9deg 22.5deg);
  -webkit-mask: radial-gradient(circle, #000 15%, transparent 60%); mask: radial-gradient(circle, #000 15%, transparent 60%); }
#stamp img { position: relative; width: 330px; height: 330px; image-rendering: pixelated; }
#stamp .txt { position: relative; }
#stamp .tier { font-size: 64px; color: var(--yellow); line-height: 1.25; text-shadow: 0 6px 0 #7a5a00; }
#stamp .pts { font-size: 46px; margin-top: 22px; }

/* tier montage */
#tiers { justify-content: center; }
.tcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
.tcard img { width: 700px; height: 700px; image-rendering: pixelated; filter: drop-shadow(0 30px 40px rgba(0,0,0,.5)); }
.tcard .nm { font-size: 76px; line-height: 1.3; margin-top: 20px; padding: 0 40px; text-shadow: 0 8px 0 rgba(0,0,0,.35); text-align: center; }
.tcard .rg { font-size: 32px; margin-top: 30px; letter-spacing: .05em; text-transform: uppercase; opacity: .9; }
#tierHead { position: absolute; top: 200px; left: 0; right: 0; text-align: center; font-size: 33px; letter-spacing: .1em; }
#tierCount { position: absolute; bottom: 200px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; }
#tierCount i { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.25); }
#tierCount i.on { background: #fff; }

/* daily + share */
#daily { padding-top: 250px; text-align: center; }
#daily .line { font-size: 52px; line-height: 1.9; }
#shareBox { position: absolute; top: 900px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
#shareCard { background: #111; border: 4px solid #3a3112; border-radius: 36px; padding: 50px 60px 44px; text-align: center;
  box-shadow: 0 0 80px rgba(255,214,10,.18); }
#shareCard .top { font-size: 30px; color: var(--soft); letter-spacing: 2px; }
#emos { margin-top: 34px; display: flex; gap: 14px; justify-content: center; font-family: "Noto Color Emoji", sans-serif; font-size: 92px; }
#emos span { display: inline-block; }
#shareScore { font-size: 84px; color: var(--yellow); margin-top: 34px; }
#shareScore span { color: var(--muted); font-size: 52px; }
#shareMsg { margin-top: 70px; font-size: 52px; line-height: 1.5; }
/* end */
#end { justify-content: center; gap: 46px; text-align: center; }
#end .logo { font-size: 108px; }
#end .tag { font-size: 50px; }
#parade { position: relative; width: 1000px; height: 300px; }
#parade img { position: absolute; width: 160px; height: 160px; image-rendering: pixelated; }
#end .cta { background: var(--yellow); color: #000; font-size: 44px; padding: 48px 70px; border-radius: 30px; box-shadow: 0 12px 0 var(--gold); }
#end .url { font-size: 42px; color: var(--soft); letter-spacing: 2px; }

#brand { position: absolute; top: 90px; left: 0; right: 0; text-align: center; font-size: 46px; opacity: 0; }
#fx { position: absolute; inset: 0; pointer-events: none; }
.spark { position: absolute; width: 0; height: 0; }
.spark b { position: absolute; display: block; margin: -11px 0 0 -11px; width: 22px; height: 22px; }
.ring { position: absolute; border-radius: 50%; border: 12px solid var(--yellow); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div id="stage">
  <div id="bgGlow"></div>
  <div id="dots"></div>
  <div id="hexes"></div>
  <div id="cam">
    <div id="brand" class="logo">HONEYDLE</div>

    <section id="hook" class="layer">
      <div id="drips"></div>
      <div class="w slam" id="h1">Bet you</div>
      <div class="w slam" id="h2">can't</div>
      <div class="w y slam" id="h3">guess</div>
      <div class="w slam" id="h4">this.</div>
      <img id="flyBee" src="/public/img/bee-honey.png" alt="">
    </section>

    <section id="game" class="layer">
      <div class="meta slam" id="meta"><span class="chip">🧬 Science</span><span class="round pixel">ROUND 1/7</span></div>
      <div class="q" id="q"></div>
      <div class="num pixel slam" id="num">0%</div>
      <div id="combHost"></div>
      <div id="slider"><div class="track"></div><div class="fill" id="sfill"></div><div class="knob" id="knob"></div></div>
      <div class="btn" id="btn">Lock it in</div>
      <div id="stamp">
        <div class="rays" id="rays"></div>
        <img src="/public/img/bee-golden.png" alt="" id="sbee">
        <div class="txt"><div class="tier slam" id="stier">✨ Golden<br>Nectar</div><div class="pts pixel" id="spts">+0</div></div>
      </div>
      <div id="touch"></div>
      <div id="ripple"></div>
    </section>

    <section id="tiers" class="layer">
      <div id="tierHead" class="pixel">EVERY GUESS HAS A FLAVOUR</div>
      <div id="tcards"></div>
      <div id="tierCount"></div>
    </section>

    <section id="daily" class="layer">
      <div class="line slam" id="l1"><em>7</em> rounds.</div>
      <div class="line slam" id="l2">Same for <em>everyone.</em></div>
      <div class="line slam" id="l3">Once a day.</div>
      <div id="shareBox">
        <div id="shareCard"><div class="top pixel">MY HONEYDLE</div><div id="emos"></div><div class="pixel" id="shareScore">0 <span>/ 1225</span></div></div>
        <div id="shareMsg" class="slam">Can your friends<br><em>beat it?</em></div>
      </div>
    </section>

    <section id="end" class="layer">
      <div class="logo slam" id="elogo">HONEYDLE</div>
      <div class="tag slam" id="etag">Sweet daily trivia</div>
      <div id="parade"></div>
      <div class="cta slam" id="cta">Play free today</div>
      <div class="url pixel slam" id="url">HONEYDLE.COM</div>
    </section>
  </div>
  <div id="fx"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
</div>

<script type="module">
import { Honeycomb, looksFor } from "/public/js/honeycomb.js";

export const DURATION = 22;
const QUESTION = "What % of human DNA is identical to chimpanzee DNA?";
const GUESS = 96, REAL = 99, POINTS = 135;
// guess path: the player drags around before settling (time, value)
const PATH = [[4.25, 0], [4.75, 42], [5.25, 81], [5.75, 64], [6.5, 96], [7.0, 96]];
// Every hit sits on a 120 BPM grid (beat = 0.5s, bars start at 0.5) so it lands with the soundtrack.
const LOCK = 7.25, REVEAL = 7.65; // the reveal hit (REVEAL + 0.85) is the drop, on the bar at 8.5
const TIERS = [
  { bee: "diamond", name: "Divine", emo: "💎", rg: "Dead on", bg: ["#0e3a66", "#7cc6ff"] },
  { bee: "golden", name: "Golden Nectar", emo: "✨", rg: "Within 3", bg: ["#5a3b00", "#ffd60a"] },
  { bee: "honey", name: "Sweet!", emo: "😋", rg: "Within 12", bg: ["#4a2300", "#ff9f0a"] },
  { bee: "lukewarm", name: "Bland", emo: "😐", rg: "Within 25", bg: ["#2a2a24", "#b8b49a"] },
  { bee: "bitter", name: "Bitter", emo: "😖", rg: "Within 40", bg: ["#26261c", "#8a8a62"] },
  { bee: "yucky", name: "Yucky", emo: "🤢", rg: "Way off", bg: ["#13300f", "#6fbf3a"] },
];
const T_START = 10.5, T_EACH = 0.5;
const SCENES = { hook: [0, 2.55], game: [2.4, 10.6], tiers: [10.45, T_START + T_EACH * 6 + 0.1], daily: [13.45, 18.6], end: [18.45, DURATION + 1] };
const IMPACTS = [ // camera shake hits: [time, strength]
  [0.55, 1], [1.05, .8], [1.55, 1.2], [2.05, .9], [2.55, .5], [LOCK + 0.05, .6], [REVEAL + 0.85, 1.4],
  ...TIERS.map((_, i) => [T_START + i * T_EACH + 0.05, 1]),
  [13.55, .8], [14.05, .8], [14.55, .8], [16.5, 1.6], [18.55, 1.4], [20.05, .6],
];
const FLASHES = [[REVEAL + 0.85, .55], [16.5, .85], [18.5, .5], ...TIERS.map((_, i) => [T_START + i * T_EACH, .25])];

const $ = (id) => document.getElementById(id);

// --- deterministic randomness ------------------------------------------------
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// --- static DOM ---------------------------------------------------------------
QUESTION.split(" ").forEach((w) => $("q").insertAdjacentHTML("beforeend",
  `<span class="wd">${w.replace(/(DNA|chimpanzee)/, "<em>$1</em>")}</span>`));
const words = [...$("q").children];

const HEX = [];
for (let i = 0; i < 16; i++) {
  const size = 60 + rnd() * 150, x = rnd() * 1080, y = rnd() * 2200, sp = 20 + rnd() * 50, rot = rnd() * 60, op = 0.05 + rnd() * 0.12;
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "-50 -50 100 100"); s.setAttribute("width", size); s.setAttribute("height", size);
  s.innerHTML = `<polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="none" stroke="#ffd60a" stroke-width="5"/>`;
  $("hexes").append(s); HEX.push({ s, size, x, y, sp, rot, op });
}
const DRIPS = [];
for (let i = 0; i < 11; i++) {
  const d = document.createElement("div"); d.className = "drip";
  const w = 50 + rnd() * 70; d.style.left = `${i * 100 - 10 + rnd() * 40}px`; d.style.width = `${w}px`;
  $("drips").append(d); DRIPS.push({ d, len: 120 + rnd() * 320, at: rnd() * 0.5 });
}
TIERS.forEach((t) => $("tcards").insertAdjacentHTML("beforeend",
  `<div class="tcard"><img src="/public/img/bee-${t.bee}.png" alt=""><div class="nm">${t.emo} ${t.name}</div><div class="rg">${t.rg}</div></div>`));
const tcards = [...$("tcards").children];
TIERS.forEach(() => $("tierCount").append(document.createElement("i")));
const dotsEl = [...$("tierCount").children];
const PARADE = ["yucky", "bitter", "lukewarm", "honey", "golden", "diamond"];
const EMOS = ["💎", "✨", "😋", "😐", "😋", "😖", "✨"];
EMOS.forEach((e) => $("emos").insertAdjacentHTML("beforeend", `<span>${e}</span>`));
const emoEls = [...$("emos").children];
PARADE.forEach((b) => $("parade").insertAdjacentHTML("beforeend", `<img src="/public/img/bee-${b}.png" alt="">`));
const paradeEls = [...$("parade").children];

// sparkle bursts: [time, x, y, colors]
const BURSTS = [
  [REVEAL + 0.85, 540, 1600, ["#ffd60a", "#fff3a3", "#ffffff"]],
  ...TIERS.map((t, i) => [T_START + i * T_EACH + 0.02, 540, 760, [t.bg[1], "#ffffff"]]),
  [16.5, 540, 1150, ["#ffd60a", "#7cc6ff", "#ffffff"]],
  [18.55, 540, 700, ["#ffd60a", "#ffffff", "#7cc6ff"]],
];
const bursts = BURSTS.map(([at, x, y, cols]) => {
  const el = document.createElement("div"); el.className = "spark"; el.style.left = `${x}px`; el.style.top = `${y}px`;
  const parts = [];
  for (let i = 0; i < 26; i++) {
    const b = document.createElement("b"); const c = cols[i % cols.length];
    const hexy = i % 3 === 0;
    b.style.background = c;
    if (hexy) b.style.clipPath = "polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"; else b.style.borderRadius = "3px";
    el.append(b);
    parts.push({ b, ang: (i / 26) * Math.PI * 2 + rnd() * 0.3, dist: 260 + rnd() * 380, sc: 0.8 + rnd() * 1.6, spin: rnd() * 720 });
  }
  const ring = document.createElement("div"); ring.className = "ring"; ring.style.borderColor = cols[0];
  $("fx").append(ring, el);
  return { at, x, y, el, parts, ring };
});

const comb = new Honeycomb($("combHost"));
comb.ro.disconnect();
comb.resize();

// --- timing helpers ----------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const back = (p, c = 2.2) => 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
const elastic = (p) => (p === 0 || p === 1 ? p : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI) / 3) + 1);
const win = (t, a, b, f = 0.25) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const lerp = (a, b, p) => a + (b - a) * p;

/** text slams in from big to size with a rotation kick */
function slam(el, t, at, { dur = 0.38, from = 2.6, rot = -6 } = {}) {
  const p = prog(t, at, at + dur);
  const s = t < at ? from : lerp(from, 1, elastic(p));
  el.style.opacity = clamp(p * 3);
  el.style.transform = `scale(${s}) rotate(${rot * (1 - easeOut(p))}deg)`;
}
function popUp(el, t, at, dur = 0.45, rise = 80) {
  const p = prog(t, at, at + dur);
  el.style.opacity = easeOut(p);
  el.style.transform = `translateY(${(1 - easeOut(p)) * rise}px) scale(${0.6 + 0.4 * back(p)})`;
}
function shake(t) {
  let x = 0, y = 0, r = 0;
  for (const [ti, a] of IMPACTS) {
    const d = t - ti; if (d < 0 || d > 0.5) continue;
    const k = a * Math.exp(-d * 11);
    x += k * 26 * Math.sin(d * 83); y += k * 20 * Math.cos(d * 71); r += k * 1.4 * Math.sin(d * 61);
  }
  return { x, y, r };
}
function guessAt(t) {
  if (t <= PATH[0][0]) return 0;
  for (let i = 1; i < PATH.length; i++) {
    const [t1, v1] = PATH[i], [t0, v0] = PATH[i - 1];
    if (t <= t1) return lerp(v0, v1, easeInOut(prog(t, t0, t1)));
  }
  return PATH.at(-1)[1];
}

function render(t) {
  for (const [id, [a, b]] of Object.entries(SCENES)) $(id).style.opacity = win(t, a, b, 0.15);
  $("brand").style.opacity = win(t, 2.45, 10.5, 0.2);

  // background: glow colour follows the scene; hexes drift up
  let glow = "rgba(255,190,0,0.20)";
  const ti = Math.floor((t - T_START) / T_EACH);
  if (t >= T_START && ti >= 0 && ti < 6) glow = TIERS[ti].bg[1] + "66";
  if (t > 16.3 && t < 18.5) glow = `rgba(255,190,0,${0.2 + 0.2 * prog(t, 16.3, 16.6)})`;
  $("bgGlow").style.background = `radial-gradient(circle at 50% 45%, ${glow}, transparent 55%)`;
  if (t >= T_START && ti >= 0 && ti < 6) {
    const [dark] = TIERS[ti].bg;
    $("stage").style.background = `radial-gradient(circle at 50% 42%, ${dark}, #000 75%)`;
  } else $("stage").style.background = "#000";
  $("dots").style.transform = `translate(${(t * 18) % 54}px, ${(-t * 30) % 54}px)`;
  for (const h of HEX) {
    const y = ((h.y - t * h.sp * 3) % 2300 + 2300) % 2300 - 200;
    h.s.style.transform = `translate(${h.x - h.size / 2}px, ${y}px) rotate(${h.rot + t * 12}deg)`;
    h.s.style.opacity = h.op * (1 + 0.6 * Math.sin(t * 2 + h.x));
  }

  // camera: shake + slow push + reveal punch-in
  const sh = shake(t);
  let zoom = 1 + 0.012 * Math.sin(t * 1.3);
  if (t < 2.55) zoom += 0.06 * prog(t, 0, 2.55);
  zoom += 0.035 * easeInOut(prog(t, REVEAL, REVEAL + 0.8)) * (1 - easeInOut(prog(t, 9.7, 10.45)));
  $("cam").style.transform = `translate(${sh.x}px, ${sh.y}px) rotate(${sh.r}deg) scale(${zoom})`;

  // flashes
  let fl = 0;
  for (const [ft, a] of FLASHES) { const d = t - ft; if (d >= 0 && d < 0.3) fl = Math.max(fl, a * (1 - d / 0.3)); }
  $("flash").style.opacity = fl;

  // ---- hook ----
  slam($("h1"), t, 0.5); slam($("h2"), t, 1.0, { rot: 7 }); slam($("h3"), t, 1.5, { from: 3.4 }); slam($("h4"), t, 2.0, { rot: 5 });
  $("h3").style.transform += ` scale(${1 + 0.05 * Math.sin(t * 9)})`;
  for (const d of DRIPS) d.d.style.height = `${d.len * easeOut(prog(t, d.at, d.at + 2.2))}px`;
  const fb = prog(t, 0.2, 2.6);
  $("flyBee").style.transform = `translate(${lerp(-260, 1100, fb)}px, ${1450 + Math.sin(t * 9) * 40 - fb * 220}px) rotate(${Math.sin(t * 12) * 10}deg)`;

  // ---- game ----
  slam($("meta"), t, 2.5, { from: 1.8 });
  words.forEach((w, i) => popUp(w, t, 2.75 + i * 0.125, 0.32, 50));
  const g = Math.round(guessAt(t));
  const num = $("num");
  if (t < REVEAL + 0.6) { num.textContent = `${g}%`; num.style.color = ""; }
  else { num.textContent = `${Math.round(lerp(GUESS, REAL, easeOut(prog(t, REVEAL + 0.6, REVEAL + 0.85))))}%`; num.style.color = "#fff"; }
  slam(num, t, 4.0, { from: 0.2, rot: 0 });
  if (t > REVEAL + 0.85) num.style.transform = `scale(${1 + 0.35 * Math.exp(-(t - REVEAL - 0.85) * 7)})`;
  // small kick on every value change while dragging
  if (t > 4.3 && t < 7.0) num.style.transform = `scale(${1 + 0.04 * Math.abs(Math.sin(t * 30))})`;
  const cp = easeOut(prog(t, 3.75, 4.25));
  $("combHost").style.opacity = cp; $("combHost").style.transform = `scale(${0.7 + 0.3 * back(cp)})`;

  // slider + finger
  const sl = $("slider");
  const slOn = prog(t, 4.0, 4.25) * (1 - prog(t, REVEAL, REVEAL + 0.2));
  sl.style.opacity = slOn;
  const W = 860, kx = (guessAt(t) / 100) * W;
  $("knob").style.left = `${kx}px`; $("sfill").style.width = `${kx}px`;
  const touch = $("touch");
  let tx = 110 + kx, ty = 1535, ton = prog(t, 4.1, 4.25) * (1 - prog(t, 6.6, 6.75));
  if (t > 6.7) { const mp = easeInOut(prog(t, 6.7, 7.15)); tx = lerp(110 + W * 0.96, 540, mp); ty = lerp(1535, 1715, mp); ton = prog(t, 6.7, 6.85) * (1 - prog(t, LOCK + 0.15, LOCK + 0.3)); }
  touch.style.left = `${tx}px`; touch.style.top = `${ty}px`; touch.style.opacity = ton;
  touch.style.transform = `scale(${t > LOCK - 0.05 && t < LOCK + 0.15 ? 0.8 : 1})`;
  const btn = $("btn");
  btn.style.opacity = prog(t, 6.5, 6.75) * (1 - prog(t, REVEAL, REVEAL + 0.15));
  const press = prog(t, LOCK - 0.05, LOCK + 0.05) * (1 - prog(t, LOCK + 0.1, LOCK + 0.2));
  btn.style.transform = `translateY(${press * 12}px) scale(${1 - press * 0.03})`;
  btn.style.boxShadow = `0 ${12 - press * 12}px 0 var(--gold)`;
  const rp = prog(t, LOCK, LOCK + 0.45);
  const rip = $("ripple"); rip.style.left = "540px"; rip.style.top = "1715px";
  rip.style.opacity = t >= LOCK ? 1 - rp : 0; rip.style.transform = `scale(${1 + rp * 8})`;

  // comb
  const target = looksFor({ mode: "reveal", guess: GUESS, real: REAL });
  const pops = [];
  if (t < REVEAL) comb.looks = looksFor({ mode: "guess", guess: g });
  else {
    const el = (t - REVEAL) * 1000, step = 8, POP = 180;
    comb.looks = new Array(100).fill("empty");
    let k = 0;
    target.forEach((look, idx) => {
      if (look === "empty") return;
      const st = k++ * step;
      if (el >= st) {
        comb.looks[idx] = look;
        const p = (el - st) / POP;
        if (p < 1) pops.push({ idx, k: 1 + 0.35 * Math.sin(Math.PI * p) });
      }
    });
  }
  comb.draw(pops);

  // result stamp
  const sp = prog(t, REVEAL + 0.85, REVEAL + 1.35);
  const sbee = $("sbee");
  sbee.style.opacity = t > REVEAL + 0.85 ? 1 : 0;
  sbee.style.transform = `translateY(${(1 - back(sp, 3)) * 400 + Math.sin(t * 6) * 12}px) rotate(${Math.sin(t * 4) * 6}deg) scale(${0.3 + 0.7 * back(sp, 3)})`;
  slam($("stier"), t, REVEAL + 1.1, { from: 3, rot: -10 });
  const pp = prog(t, REVEAL + 1.35, REVEAL + 2.35);
  $("spts").textContent = `+${Math.round(POINTS * easeOut(pp))} PTS`;
  $("spts").style.opacity = prog(t, REVEAL + 1.35, REVEAL + 1.45);
  $("rays").style.opacity = 0.9 * prog(t, REVEAL + 0.85, REVEAL + 1.2);
  $("rays").style.transform = `rotate(${t * 25}deg) scale(${0.6 + 0.4 * easeOut(sp)})`;

  // ---- tier montage ----
  tcards.forEach((c, i) => {
    const a = T_START + i * T_EACH;
    const on = t >= a && t < a + T_EACH;
    c.style.opacity = on ? 1 : 0;
    if (!on) return;
    const p = prog(t, a, a + 0.32);
    const img = c.querySelector("img");
    const dir = i % 2 ? 1 : -1;
    img.style.transform = `translateX(${(1 - easeOut(p)) * 700 * dir}px) rotate(${(1 - easeOut(p)) * 25 * dir + Math.sin(t * 8) * 3}deg) scale(${0.5 + 0.5 * back(p, 2.6)}) translateY(${Math.sin(t * 7) * 14}px)`;
    slam(c.querySelector(".nm"), t, a + 0.08, { from: 2.2, rot: 6 * dir, dur: 0.3 });
    popUp(c.querySelector(".rg"), t, a + 0.16, 0.25, 40);
    c.querySelector(".nm").style.color = i === 0 ? "#bfe6ff" : i < 3 ? "#ffd60a" : "#ffffff";
  });
  dotsEl.forEach((d, i) => d.classList.toggle("on", t >= T_START + i * T_EACH));
  slam($("tierHead"), t, T_START - 0.05, { from: 1.6, rot: 0 });

  // ---- daily + share ----
  slam($("l1"), t, 13.5); slam($("l2"), t, 14.0, { rot: 5 }); slam($("l3"), t, 14.5);
  popUp($("shareBox"), t, 15.0, 0.4, 120);
  emoEls.forEach((e, i) => slam(e, t, 15.25 + i * 0.125, { from: 3, rot: i % 2 ? 12 : -12, dur: 0.3 }));
  const sc = Math.round(815 * easeInOut(prog(t, 15.5, 16.5)));
  const ss = $("shareScore");
  ss.innerHTML = `${sc} <span>/ 1225</span>`;
  ss.style.transform = `scale(${t > 16.5 ? 1 + 0.3 * Math.exp(-(t - 16.5) * 7) : 1})`;
  slam($("shareMsg"), t, 17.0, { from: 2.2, rot: -5 });

  // ---- end card ----
  slam($("elogo"), t, 18.5, { from: 3.5, rot: -8, dur: 0.45 });
  $("elogo").style.textShadow = `8px 8px 0 #7a5a00, 0 0 ${50 + 30 * Math.sin(t * 5)}px rgba(255,214,10,.7)`;
  slam($("etag"), t, 19.0, { from: 2, rot: 4 });
  paradeEls.forEach((b, i) => {
    const row = 0, col = i;
    const p = prog(t, 19.25 + i * 0.125, 19.65 + i * 0.125);
    const x = 5 + col * 166;
    const hop = Math.abs(Math.sin(t * 5 + i * 0.8)) * 22;
    b.style.left = `${x}px`; b.style.top = "90px";
    b.style.opacity = clamp(p * 2);
    b.style.transform = `translateY(${(1 - back(p, 2.8)) * 500 - hop}px) rotate(${Math.sin(t * 4 + i) * 7}deg)`;
  });
  slam($("cta"), t, 20.0, { from: 2.4, rot: -4 });
  if (t > 20.5) $("cta").style.transform = `scale(${1 + 0.07 * Math.exp(-(((t - 0.5) % 0.5) * 9))})`; // thumps on every beat
  slam($("url"), t, 20.5, { from: 1.8, rot: 0 });

  // ---- fx bursts ----
  for (const B of bursts) {
    const d = t - B.at, on = d >= 0 && d < 0.9;
    B.el.style.opacity = on ? 1 : 0; B.ring.style.opacity = on ? Math.max(0, 1 - d / 0.45) : 0;
    if (!on) continue;
    const p = easeOut(clamp(d / 0.9));
    for (const q of B.parts) {
      const r = q.dist * p, x = Math.cos(q.ang) * r, y = Math.sin(q.ang) * r + 260 * d * d;
      q.b.style.transform = `translate(${x}px, ${y}px) rotate(${q.spin * p}deg) scale(${q.sc * (1 - clamp((d - 0.4) / 0.5))})`;
    }
    const rr = 60 + 700 * easeOut(clamp(d / 0.45));
    Object.assign(B.ring.style, { left: `${B.x - rr}px`, top: `${B.y - rr}px`, width: `${rr * 2}px`, height: `${rr * 2}px`, borderWidth: `${14 * (1 - clamp(d / 0.45)) + 1}px` });
  }
}

window.DURATION = DURATION;
window.render = render;
await document.fonts.ready;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
render(0);
window.ready = true;
if (location.hash === "#play") {
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
