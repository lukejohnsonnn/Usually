# Render Blueprint for Honeydle — free web service + free Postgres.
# Service and database names are kept from v1 so this updates the existing
# Blueprint in place instead of creating a second service.
services:
  - type: web
    name: usually
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: usually-db
          property: connectionString

databases:
  - name: usually-db
    plan: free

# Deliberately no cron job: the Daily freezes lazily on the first request of
# each Eastern day (and self-heals on boot), so no scheduler is needed.
